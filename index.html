<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chuleta — Spanish flashcards</title>
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="chuleta">
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-back: #eef3fa;
    --ink: #1b2733;
    --ink-soft: #5a6b7d;
    --line: #d8dfe7;
    --accent: #2456a6;
    --accent-ink: #ffffff;
    --good: #2e7d52;
    --good-soft: #e3f1e9;
    --bad: #b04a3a;
    --bad-soft: #f7e8e5;
    --marigold: #e8a13d;
    --shadow: 0 10px 30px rgba(27, 39, 51, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d;
      --surface: #1a232e;
      --surface-back: #20304a;
      --ink: #e9edf2;
      --ink-soft: #93a3b4;
      --line: #2c3947;
      --accent: #6fa8ff;
      --accent-ink: #0d1723;
      --good: #5cbd8b;
      --good-soft: #1d3328;
      --bad: #e08573;
      --bad-soft: #3a241f;
      --marigold: #f0b45c;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    width: min(680px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    padding: 2rem 0 3rem;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h1 {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 1.9rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 .tag {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-weight: 400;
    margin-left: 0.6rem;
    letter-spacing: 0;
  }
  .stats { font-size: 0.85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  .stats .learned { color: var(--good); }

  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .controls select, .controls button {
    font: inherit;
    font-size: 0.85rem;
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .controls button:hover, .controls select:hover { border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: var(--surface); }
  .seg button.active { background: var(--accent); color: var(--accent-ink); }
  .spacer { flex: 1; }

  .card-stage { perspective: 1200px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.3, 0.9, 0.3, 1);
  }
  .card.flipped { transform: rotateX(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2.5rem 2rem;
    gap: 1rem;
  }
  .face.back {
    transform: rotateX(180deg);
    background: var(--surface-back);
  }
  .face .eyebrow {
    position: absolute;
    top: 1.1rem;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
  }
  .face .phrase {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: clamp(1.5rem, 4.5vw, 2.2rem);
    line-height: 1.3;
    text-wrap: balance;
    margin: 0;
  }
  .face .hint {
    position: absolute;
    bottom: 1.1rem;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  .face .note { font-size: 0.9rem; color: var(--ink-soft); max-width: 46ch; }
  .face .say {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    font-size: 1.05rem;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.35rem;
    opacity: 0.55;
  }
  .face .say:hover { opacity: 1; }
  .face .say[hidden] { display: none; }

  .judge { display: flex; gap: 0.75rem; justify-content: center; min-height: 3rem; }
  .judge button {
    font: inherit;
    font-size: 0.95rem;
    padding: 0.65rem 1.6rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .judge .yes { border-color: var(--good); color: var(--good); background: var(--good-soft); }
  .judge .yes:hover { background: var(--good); color: #fff; }
  .judge .no { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .judge .no:hover { background: var(--bad); color: #fff; }
  .judge.hidden { visibility: hidden; }

  .nav { display: flex; justify-content: space-between; align-items: center; min-height: 2.2rem; }
  .nav button {
    font: inherit;
    font-size: 0.9rem;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0.4rem 0.6rem;
  }
  .nav .pos { font-size: 0.85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .nav.hidden { visibility: hidden; }

  .progress {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress div { height: 100%; background: var(--good); width: 0; transition: width 0.3s; }

  footer {
    font-size: 0.75rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.8;
  }
  footer kbd {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 0.72rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>chuleta<span class="tag">tu hoja de trucos 🥩</span></h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="seg">
      <button id="modeStudy" class="active">Repasar</button>
      <button id="modeBrowse">Explorar</button>
    </div>
    <select id="category" title="Categoría"></select>
    <button id="direction" title="Cambiar dirección">ES → EN</button>
    <button id="sound" title="Pronunciar automáticamente el español al descubrirlo">🔊 auto</button>
    <button id="shuffle" hidden>Barajar</button>
    <span class="spacer"></span>
    <button id="reset">Reiniciar progreso</button>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face front">
        <button class="say" id="sayFront" title="Escuchar (e)">🔊</button>
        <span class="eyebrow" id="frontCat"></span>
        <p class="phrase" id="frontText"></p>
        <span class="hint" id="frontHint">dilo en voz alta, luego gira</span>
      </div>
      <div class="face back">
        <button class="say" id="sayBack" title="Escuchar (e)">🔊</button>
        <span class="eyebrow" id="backLabel"></span>
        <p class="phrase" id="backText"></p>
        <p class="note" id="backNote"></p>
        <span class="hint" id="backHint"></span>
      </div>
    </div>
  </div>

  <div class="judge hidden" id="judge">
    <button class="yes" id="correct">Correcta ✓</button>
    <button class="no" id="wrong">Incorrecta ✗</button>
  </div>

  <div class="nav hidden" id="nav">
    <button id="prev">← anterior</button>
    <span class="pos" id="pos"></span>
    <button id="next">siguiente →</button>
  </div>

  <footer>
    <kbd>espacio</kbd> girar &nbsp; <kbd>1</kbd> correcta &nbsp; <kbd>2</kbd> incorrecta &nbsp;
    <kbd>e</kbd> escuchar &nbsp; <kbd>←</kbd><kbd>→</kbd> explorar &nbsp; <kbd>s</kbd> barajar
  </footer>
</main>

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
let newLog = JSON.parse(localStorage.getItem("chuleta-newlog") || "{}");
function rolloverNewLog() {
  if (newLog.date !== todayKey()) newLog = { date: todayKey(), count: 0 };
}
function saveNewLog() { localStorage.setItem("chuleta-newlog", JSON.stringify(newLog)); }

// ---- SRS state (SM-2) ----
// Per card: reps (consecutive successes), ease factor, interval in days, due timestamp.
let srs = JSON.parse(localStorage.getItem("chuleta-srs") || "{}");
function stateOf(id) {
  return srs[id] || { reps: 0, ease: 2.5, interval: 0, due: 0, lapses: 0 };
}
function saveSrs() { localStorage.setItem("chuleta-srs", JSON.stringify(srs)); }

// Direction setting: "mix" rolls per card (75% EN→ES production practice,
// 25% ES→EN recognition); activeDir is the roll for the card on screen.
let dir = localStorage.getItem("chuleta-dir2") || "mix";
let activeDir = "en-es";
let mode = "study";           // "study" | "browse"
let category = "Todas";
let flipped = false;

function rollDir() {
  activeDir = dir === "mix" ? (Math.random() < 0.75 ? "en-es" : "es-en") : dir;
}

// ---- Text-to-speech ----
// Hearing the word builds its phonological form; reading alone means rehearsing
// a guessed pronunciation. Auto mode speaks the Spanish whenever it's revealed
// (never before — it would give the answer away); 🔊 or "e" speak on demand.
let autoSay = localStorage.getItem("chuleta-sound") !== "0";
let lastSpoken = "";

function esVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("es"));
  return vs.find(v => v.lang === "es-ES") || vs[0] || null;
}
if ("speechSynthesis" in window) speechSynthesis.getVoices(); // warm up async voice list

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = esVoice();
  if (v) u.voice = v;
  u.lang = "es-ES";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function showingSpanish() {
  return activeDir === "es-en" ? !flipped : flipped;
}

function maybeAutoSay(card) {
  if (!autoSay || mode !== "study" || !card || !showingSpanish()) return;
  const key = card.id + (flipped ? ":b" : ":f");
  if (key === lastSpoken) return;
  lastSpoken = key;
  speak(card.es);
}

// Study session
let queue = [];               // card ids: due reviews first, then new cards
let sessionTotal = 0;
let sessionDone = 0;

// Browse session
let browseOrder = [];
let browseIdx = 0;

function filteredDeck() {
  return DECK.filter(c => category === "Todas" || c.cat === category);
}

function buildQueue() {
  rolloverNewLog();
  const now = Date.now();
  const cards = filteredDeck();
  // Due = any card with saved state whose time has come. That includes lapsed
  // cards (reps 0 but seen before) — relearning doesn't consume new-card slots.
  const due = cards.filter(c => srs[c.id] && srs[c.id].due <= now)
                   .sort((a, b) => stateOf(a.id).due - stateOf(b.id).due);
  const slots = Math.max(0, NEW_PER_DAY - newLog.count);
  const fresh = cards.filter(c => !srs[c.id]).slice(0, slots);
  queue = [...due, ...fresh].map(c => c.id);
  sessionTotal = queue.length;
  sessionDone = 0;
}

function buildBrowse() {
  browseOrder = filteredDeck().map(c => c.id);
  browseIdx = 0;
}

function cardById(id) { return DECK.find(c => c.id === id); }

function currentCard() {
  if (mode === "study") return queue.length ? cardById(queue[0]) : null;
  if (!browseOrder.length) return null;
  browseIdx = ((browseIdx % browseOrder.length) + browseOrder.length) % browseOrder.length;
  return cardById(browseOrder[browseIdx]);
}

function humanDelay(ms) {
  if (ms <= 0) return "ahora";
  const h = Math.round(ms / 3600000);
  if (h < 20) return "en " + Math.max(1, h) + (h === 1 ? " hora" : " horas");
  const d = Math.round(ms / DAY);
  return d === 1 ? "mañana" : "en " + d + " días";
}

function nextDueInfo() {
  const upcoming = filteredDeck()
    .map(c => stateOf(c.id))
    .filter(s => s.reps > 0 && s.due > Date.now());
  if (!upcoming.length) return "";
  const soonest = Math.min(...upcoming.map(s => s.due));
  return "Próximo repaso: " + humanDelay(soonest - Date.now());
}

// ---- SM-2 grading, binary buttons ----
// Correct: interval 1d → 6d → interval × ease (classic SM-2 steps); ease
// recovers +0.05 per success (cap 2.5) so a rough start isn't a life sentence.
// Wrong: lapse — ease drops 0.2 (floor 1.3), card resets and retries later
// in this same session; clearing it then schedules it for tomorrow.
function grade(correct) {
  if (mode !== "study" || !queue.length || !flipped) return;
  const id = queue.shift();
  const isNew = !srs[id];
  const s = stateOf(id);
  if (correct) {
    if (s.reps === 0) s.interval = 1;
    else if (s.reps === 1) s.interval = 6;
    else s.interval = Math.round(s.interval * s.ease);
    s.ease = Math.min(2.5, Math.round((s.ease + 0.05) * 100) / 100);
    s.reps += 1;
    s.due = Date.now() + s.interval * DAY;
    sessionDone += 1;
  } else {
    s.ease = Math.max(1.3, Math.round((s.ease - 0.2) * 100) / 100);
    s.reps = 0;
    s.interval = 0;
    s.lapses += 1;
    queue.splice(Math.min(5, queue.length), 0, id);
  }
  srs[id] = s;
  saveSrs();
  if (isNew) { rolloverNewLog(); newLog.count += 1; saveNewLog(); }
  flipped = false;
  rollDir();
  render();
}

function renderStats() {
  const cards = filteredDeck();
  const now = Date.now();
  let fresh = 0, due = 0, learned = 0;
  cards.forEach(c => {
    const s = stateOf(c.id);
    if (!srs[c.id]) fresh++;
    else if (s.due <= now) due++;
    if (s.interval >= 21) learned++;
  });
  $("stats").innerHTML =
    "nuevas <b>" + fresh + "</b> · para hoy <b>" + due + "</b> · " +
    "<span class='learned'>aprendidas <b>" + learned + "</b></span>";
}

function render() {
  renderStats();
  $("direction").textContent =
    dir === "mix" ? "Mixto 🎲" : dir === "es-en" ? "ES → EN" : "EN → ES";
  $("direction").title = dir === "mix"
    ? "75% EN→ES, 25% ES→EN — pulsa para fijar la dirección"
    : "Pulsa para cambiar la dirección";
  $("sound").textContent = autoSay ? "🔊 auto" : "🔇 manual";
  $("shuffle").hidden = mode === "study";
  $("modeStudy").classList.toggle("active", mode === "study");
  $("modeBrowse").classList.toggle("active", mode === "browse");
  $("nav").classList.toggle("hidden", mode === "study");

  const card = currentCard();
  const cardEl = $("card");

  if (mode === "study") {
    $("bar").style.width = sessionTotal ? (sessionDone / sessionTotal * 100) + "%" : "0%";
    $("judge").classList.toggle("hidden", !card || !flipped);
  } else {
    $("bar").style.width = "0%";
    $("judge").classList.add("hidden");
    $("pos").textContent = browseOrder.length ? (browseIdx + 1) + " / " + browseOrder.length : "0 / 0";
  }

  if (!card) {
    $("frontText").textContent = mode === "study" ? "🎉 ¡Todo hecho por hoy!" : "No hay tarjetas aquí";
    $("frontCat").textContent = "";
    $("frontHint").textContent = mode === "study" ? nextDueInfo() : "";
    $("backText").textContent = "";
    $("backNote").textContent = "";
    $("backHint").textContent = "";
    $("sayFront").hidden = true;
    $("sayBack").hidden = true;
    cardEl.classList.remove("flipped");
    return;
  }

  const s = stateOf(card.id);
  $("frontText").textContent = activeDir === "es-en" ? card.es : card.en;
  $("backText").textContent = activeDir === "es-en" ? card.en : card.es;
  $("backNote").textContent = card.note || "";
  $("frontCat").textContent = card.cat + (mode === "study" && s.reps === 0 ? " · nueva" : "");
  $("backLabel").textContent = activeDir === "es-en" ? "English" : "Español";
  $("frontHint").textContent = mode === "study" ? "dilo en voz alta, luego gira" : "toca para girar";
  $("backHint").textContent = mode === "study"
    ? "si acertaste, la próxima será " + humanDelay((s.reps === 0 ? 1 : s.reps === 1 ? 6 : Math.round(s.interval * s.ease)) * DAY)
      // projected with pre-recovery ease; off by at most a day on long intervals
    : "";
  $("sayFront").hidden = activeDir !== "es-en";
  $("sayBack").hidden = activeDir !== "en-es";
  cardEl.classList.toggle("flipped", flipped);
  maybeAutoSay(card);
}

function flip() {
  if (!currentCard()) return;
  flipped = !flipped;
  render();
}

function move(step) {
  if (mode !== "browse") return;
  flipped = false;
  browseIdx += step;
  rollDir();
  render();
}

function setMode(m) {
  mode = m;
  flipped = false;
  if (m === "study") buildQueue(); else buildBrowse();
  rollDir();
  render();
}

$("card").addEventListener("click", flip);
$("correct").addEventListener("click", () => grade(true));
$("wrong").addEventListener("click", () => grade(false));
$("next").addEventListener("click", () => move(1));
$("prev").addEventListener("click", () => move(-1));
$("modeStudy").addEventListener("click", () => setMode("study"));
$("modeBrowse").addEventListener("click", () => setMode("browse"));

$("shuffle").addEventListener("click", () => {
  for (let i = browseOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [browseOrder[i], browseOrder[j]] = [browseOrder[j], browseOrder[i]];
  }
  browseIdx = 0; flipped = false; rollDir(); render();
});

$("direction").addEventListener("click", () => {
  dir = dir === "mix" ? "en-es" : dir === "en-es" ? "es-en" : "mix";
  localStorage.setItem("chuleta-dir2", dir);
  flipped = false; rollDir(); render();
});

$("sound").addEventListener("click", () => {
  autoSay = !autoSay;
  localStorage.setItem("chuleta-sound", autoSay ? "1" : "0");
  if (!autoSay && "speechSynthesis" in window) speechSynthesis.cancel();
  render();
});

["sayFront", "sayBack"].forEach(id => $(id).addEventListener("click", e => {
  e.stopPropagation();
  const card = currentCard();
  if (card) speak(card.es);
}));

$("reset").addEventListener("click", () => {
  if (!confirm("¿Borrar todo el progreso de repaso?")) return;
  srs = {};
  saveSrs();
  newLog = { date: todayKey(), count: 0 };
  saveNewLog();
  setMode(mode);
});

const cats = ["Todas", ...new Set(DECK.map(c => c.cat))];
$("category").innerHTML = cats.map(c => `<option>${c}</option>`).join("");
$("category").addEventListener("change", e => {
  category = e.target.value;
  setMode(mode);
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "1") grade(true);
  else if (e.key === "2") grade(false);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "s" && mode === "browse") $("shuffle").click();
  else if (e.key === "e") {
    const c = currentCard();
    if (c && showingSpanish()) speak(c.es);
  }
});

setMode("study");

// Offline support when served over http(s); skipped for file:// so
// double-clicking the file keeps working like before.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
