<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chuleta — Spanish flashcards</title>
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="chuleta">
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-back: #eef3fa;
    --ink: #1b2733;
    --ink-soft: #5a6b7d;
    --line: #d8dfe7;
    --accent: #2456a6;
    --accent-ink: #ffffff;
    --good: #2e7d52;
    --good-soft: #e3f1e9;
    --bad: #b04a3a;
    --bad-soft: #f7e8e5;
    --marigold: #e8a13d;
    --shadow: 0 10px 30px rgba(27, 39, 51, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d;
      --surface: #1a232e;
      --surface-back: #20304a;
      --ink: #e9edf2;
      --ink-soft: #93a3b4;
      --line: #2c3947;
      --accent: #6fa8ff;
      --accent-ink: #0d1723;
      --good: #5cbd8b;
      --good-soft: #1d3328;
      --bad: #e08573;
      --bad-soft: #3a241f;
      --marigold: #f0b45c;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    width: min(680px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    padding: 2rem 0 3rem;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h1 {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 1.9rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 .tag {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-weight: 400;
    margin-left: 0.6rem;
    letter-spacing: 0;
  }
  .stats { font-size: 0.85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  .stats .learned { color: var(--good); }

  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .controls select, .controls button {
    font: inherit;
    font-size: 0.85rem;
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .controls button:hover, .controls select:hover { border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: var(--surface); }
  .seg button.active { background: var(--accent); color: var(--accent-ink); }
  .spacer { flex: 1; }

  .card-stage { perspective: 1200px; }
  .card {
    position: relative;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    width: 100%;
    min-height: 300px;
    cursor: pointer;
    transform-style: preserve-3d;
  }
  .card.flipped { transform: rotateX(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2.5rem 2rem;
    gap: 1rem;
  }
  .face.back {
    transform: rotateX(180deg);
    background: var(--surface-back);
  }
  .face .eyebrow {
    position: absolute;
    top: 1.1rem;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
  }
  .face .phrase {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: clamp(1.5rem, 4.5vw, 2.2rem);
    line-height: 1.3;
    text-wrap: balance;
    margin: 0;
  }
  .face .hint {
    position: absolute;
    bottom: 1.1rem;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  .face .note { font-size: 0.9rem; color: var(--ink-soft); max-width: 46ch; }
  .face .gloss {
    font-size: 0.78rem;
    color: var(--ink-soft);
    max-width: 52ch;
    line-height: 1.7;
    margin: 0;
  }
  .face .gloss b { color: var(--ink); font-weight: 600; }
  .face .say {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    font-size: 1.05rem;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.35rem;
    opacity: 0.55;
  }
  .face .say:hover { opacity: 1; }
  .face .say[hidden] { display: none; }
  .face .peek {
    font: inherit;
    font-size: 0.8rem;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.9rem;
    cursor: pointer;
  }
  .face .peek[hidden] { display: none; }
  .face .overtime { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  .face .overtime[hidden] { display: none; }
  .face .overtime button {
    font: inherit;
    font-size: 0.85rem;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.4rem 1.1rem;
    cursor: pointer;
  }
  .face .overtime button:hover { border-color: var(--accent); }

  .face .score { font-size: 0.8rem; color: var(--ink-soft); margin: 0; max-width: 52ch; }
  .w-good { color: var(--good); }
  .w-mid { color: var(--marigold); }
  .w-bad { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 0.2em; }
  #backText span { cursor: pointer; }

  .microw { display: flex; gap: 0.75rem; justify-content: center; align-items: center; min-height: 2.6rem; }
  .microw.hidden { visibility: hidden; }
  .microw button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5rem 1.4rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    background: var(--surface);
    cursor: pointer;
  }
  .microw button.rec { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .micstatus { font-size: 0.75rem; color: var(--ink-soft); }

  .judge { display: flex; gap: 0.75rem; justify-content: center; min-height: 3rem; }
  .judge button {
    font: inherit;
    font-size: 0.95rem;
    padding: 0.65rem 1.6rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .judge .yes { border-color: var(--good); color: var(--good); background: var(--good-soft); }
  .judge .yes:hover { background: var(--good); color: #fff; }
  .judge .no { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .judge .no:hover { background: var(--bad); color: #fff; }
  .judge button:disabled { opacity: 0.35; cursor: not-allowed; }
  .judge .later { border-color: var(--line); color: var(--ink-soft); background: none; }
  .judge .later:hover { border-color: var(--accent); color: var(--accent); }
  .judge .yes:disabled:hover { background: var(--good-soft); color: var(--good); }
  .judge .no:disabled:hover { background: var(--bad-soft); color: var(--bad); }
  .judge.hidden { visibility: hidden; }

  .nav { display: flex; justify-content: space-between; align-items: center; min-height: 2.2rem; }
  .nav button {
    font: inherit;
    font-size: 0.9rem;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0.4rem 0.6rem;
  }
  .nav .pos { font-size: 0.85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .nav.hidden { visibility: hidden; }

  .progress {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress div { height: 100%; background: var(--good); width: 0; transition: width 0.3s; }

  footer {
    font-size: 0.75rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.8;
  }
  footer kbd {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 0.72rem;
  }
  /* Hotkey hints mean nothing on touch screens. */
  @media (hover: none) and (pointer: coarse) {
    footer { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>chuleta<span class="tag">your cheat sheet 🥩</span></h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="seg">
      <button id="modeStudy" class="active">Study</button>
      <button id="modeBrowse">Browse</button>
    </div>
    <select id="category" title="Category"></select>
    <button id="direction" title="Change direction">ES → EN</button>
    <button id="sound" title="Auto-play audio">🔊 auto</button>
    <button id="textmode" title="Text: always show text · Auto: well-known cards switch to audio-only · Audio: always audio-only">🎓 auto</button>
    <button id="rateEs" title="Spanish voice speed">ES 1×</button>
    <button id="rateEn" title="English voice speed">EN 1×</button>
    <button id="shuffle" hidden>Shuffle</button>
    <span class="spacer"></span>
    <button id="reset">Reset progress</button>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face front">
        <button class="say" id="sayFront" title="Listen (e)">🔊</button>
        <span class="eyebrow" id="frontCat"></span>
        <p class="phrase" id="frontText"></p>
        <button class="peek" id="peek" hidden>show text (t)</button>
        <div class="overtime" id="overtime" hidden>
          <button id="morePractice">♻ keep practicing</button>
          <button id="moreNew">+10 new cards</button>
        </div>
        <span class="hint" id="frontHint">say it out loud, then flip</span>
      </div>
      <div class="face back">
        <button class="say" id="sayBack" title="Listen (e)">🔊</button>
        <span class="eyebrow" id="backLabel"></span>
        <p class="phrase" id="backText"></p>
        <p class="score" id="backScore"></p>
        <p class="note" id="backNote"></p>
        <p class="gloss" id="backGloss"></p>
        <span class="hint" id="backHint"></span>
      </div>
    </div>
  </div>

  <div class="microw hidden" id="microw">
    <button id="mic">🎤 say it (m)</button>
    <span class="micstatus" id="micStatus"></span>
  </div>

  <div class="judge hidden" id="judge">
    <button class="yes" id="correct">Correct ✓</button>
    <button class="no" id="wrong">Wrong ✗</button>
    <button class="later" id="skip">skip ↷</button>
  </div>

  <div class="nav hidden" id="nav">
    <button id="prev">← previous</button>
    <span class="pos" id="pos"></span>
    <button id="next">next →</button>
  </div>

  <footer>
    <kbd>space</kbd> flip &nbsp; <kbd>1</kbd> correct &nbsp; <kbd>2</kbd> wrong &nbsp; <kbd>s</kbd>/<kbd>→</kbd> skip &nbsp;
    <kbd>e</kbd> listen &nbsp; <kbd>m</kbd> say it &nbsp; <kbd>t</kbd> show text
  </footer>
</main>

<script>
const DECK = [
  // Cumpleaños y signos
  { es: "¿Cuándo es tu cumpleaños?", en: "When is your birthday?", cat: "Birthdays & signs" },
  { es: "Mi cumpleaños es el doce de noviembre", en: "My birthday is November 12th", cat: "Birthdays & signs" },
  { es: "¿Qué signo eres?", en: "What sign are you?", cat: "Birthdays & signs" },
  { es: "Soy escorpio", en: "I am a Scorpio", cat: "Birthdays & signs" },
  { es: "Mi signo es escorpio", en: "My sign is Scorpio", cat: "Birthdays & signs" },

  // Trabajo y estudios
  { es: "¿Estudias y/o trabajas?", en: "Do you study and/or work?", cat: "Work & studies",
    note: "spoken: \"¿Estudias o trabajas?\" — also famously a cheesy pickup line" },
  { es: "Trabajo desde casa", en: "I work from home", cat: "Work & studies",
    note: "(Yo) trabajo = I work" },
  { es: "¿Qué estudias?", en: "What do you study?", cat: "Work & studies" },
  { es: "¿Qué estudiaste?", en: "What did you study?", cat: "Work & studies" },
  { es: "Yo estudié...", en: "I studied...", cat: "Work & studies" },
  { es: "Estudié electrónica e informática", en: "I studied electronics and computer science", cat: "Work & studies",
    note: "\"e\" instead of \"y\" before words starting with an i- sound" },
  { es: "¿De qué trabajas? / ¿A qué te dedicas?", en: "What do you do for a living?", cat: "Work & studies" },
  { es: "Me dedico a dormir y a trabajar", en: "I dedicate myself to sleeping and working", cat: "Work & studies" },
  { es: "Pues trabajo de programador, en una fundación de blockchain", en: "Well, I work as a programmer at a blockchain nonprofit", cat: "Work & studies",
    note: "\"una fundación\" implies nonprofit on its own" },
  { es: "Soy informático", en: "I work in software / IT", cat: "Work & studies",
    note: "\"informática\" if you use feminine forms" },

  // Tiempo libre
  { es: "¿Qué aficiones tienes?", en: "What hobbies do you have?", cat: "Free time" },
  { es: "¿Qué haces en tu tiempo libre?", en: "What do you do in your free time?", cat: "Free time" },
  { es: "¿Qué te gusta hacer en tu tiempo libre?", en: "What do you like to do in your free time?", cat: "Free time" },
  { es: "En mi tiempo libre me gusta...", en: "In my free time I like...", cat: "Free time" },
  { es: "hacer ejercicio de fuerza", en: "to do strength training", cat: "Free time" },
  { es: "Hoy voy a hacer yoga", en: "Today I'm going to do yoga", cat: "Free time",
    note: "hacer yoga = to do yoga" },
  { es: "escuchar música jazz en directo", en: "to listen to live jazz music", cat: "Free time" },
  { es: "Esta noche hay música en directo", en: "There's live music tonight", cat: "Free time",
    note: "Spain says \"en directo\"; Latin America says \"en vivo\" — both correct — música en directo = live music" },
  { es: "Pero trabajo la mayoría del tiempo", en: "But I work most of the time", cat: "Free time" },

  // Conversación sobre yoga
  { es: "¿Cuántas veces a la semana haces yoga?", en: "How many times a week do you do yoga?", cat: "Yoga" },
  { es: "¿Qué tipo de yoga?", en: "What kind of yoga?", cat: "Yoga" },
  { es: "Me gusta hacer yoga tres veces por semana", en: "I like to do yoga three times a week", cat: "Yoga" },
  { es: "Me gusta hacer flow yoga", en: "I like to do flow yoga", cat: "Yoga" },
  { es: "Me gusta el yoga en general", en: "I like yoga in general", cat: "Yoga" },
  { es: "¿Hace cuánto (tiempo) haces yoga?", en: "How long have you been doing yoga?", cat: "Yoga",
    note: "very Spanish alternative: \"¿Cuánto tiempo llevas haciendo yoga?\"" },
  { es: "¿Cómo lo descubriste?", en: "How did you discover it?", cat: "Yoga" },
  { es: "Descubrí el yoga durante la pandemia", en: "I discovered yoga during the pandemic", cat: "Yoga",
    note: "also: \"durante el Covid\" / \"en el confinamiento\" (during lockdown)" },
  { es: "¿Y qué te enganchó del yoga?", en: "And what hooked you on yoga?", cat: "Yoga" },
  { es: "El yoga me curó la ansiedad", en: "Yoga cured my anxiety", cat: "Yoga",
    note: "Spanish prefers \"me curó la ansiedad\" over \"curó mi ansiedad\" (English-flavored)" },
  { es: "Y me ayudó a verme y a conocerme a mí mismo", en: "And it helped me see myself clearly and get to know myself", cat: "Yoga",
    note: "simpler everyday version: \"Me ayudó a conocerme mejor\"" },

  // Cómo estás
  { es: "Estoy cansado / cansada", en: "I'm tired", cat: "How are you?",
    note: "careful: \"casado\" (no n) means married!" },
  { es: "Estoy un poco cansado", en: "I'm a little tired", cat: "How are you?" },
  { es: "Estoy agotado", en: "I'm exhausted", cat: "How are you?" },
  { es: "Estoy cansado pero bien", en: "I'm tired but good", cat: "How are you?" },
  { es: "No he dormido bien", en: "I haven't slept well", cat: "How are you?",
    note: "Spain: perfect tense when the period includes now (e.g. said the next morning). LatAm: \"no dormí bien\"" },
  { es: "He dormido fatal", en: "I've slept terribly", cat: "How are you?",
    note: "\"fatal\" = terribly — a favorite Spain word" },
  { es: "Anoche no dormí bien", en: "I didn't sleep well last night", cat: "How are you?",
    note: "\"anoche\" pins a closed past moment, so the tense flips to \"dormí\"" },

  // Frases de clase
  { es: "¿Qué significa...?", en: "What does ... mean?", cat: "Classroom phrases" },
  { es: "¿Qué quiere decir...?", en: "What does ... mean? (lit. \"want to say\")", cat: "Classroom phrases" },
  { es: "¿Cómo se dice ... en español?", en: "How do you say ... in Spanish?", cat: "Classroom phrases" },
  { es: "¿Cómo se escribe?", en: "How do you spell / write it?", cat: "Classroom phrases" },
  { es: "No entiendo", en: "I don't understand", cat: "Classroom phrases" },
  { es: "¿Me lo repites, porfa?", en: "Can you say that again, pls?", cat: "Classroom phrases",
    note: "porfa = please (casual, like \"pls\")" },

  // Vocabulario
  { es: "Quiero descubrir sitios nuevos", en: "I want to discover new places", cat: "Vocabulary",
    note: "descubrir = to discover / to find out" },
  { es: "Esta serie me engancha", en: "This show hooks me", cat: "Vocabulary",
    note: "enganchar = to hook (someone on something)" },
  { es: "El tiempo lo cura todo", en: "Time cures everything", cat: "Vocabulary",
    note: "curar = to cure" },
  { es: "Necesito ayuda con esto", en: "I need help with this", cat: "Vocabulary",
    note: "la ayuda = help (noun)" },
  { es: "¿Te puedo ayudar?", en: "Can I help you?", cat: "Vocabulary",
    note: "ayudar = to help" },
  { es: "¿Vemos una peli esta noche?", en: "Shall we watch a movie tonight?", cat: "Vocabulary",
    note: "Spanish uses ver for TV and sports: vi el partido (not mirar) — ver = to see / to watch" },
  { es: "Quiero conocer a tus amigos", en: "I want to meet your friends", cat: "Vocabulary",
    note: "takes the personal \"a\": conocer a alguien — conocer = to know (a person) / to meet for the first time" },
  { es: "Estoy aprendiendo a conocerme", en: "I'm learning to know myself", cat: "Vocabulary",
    note: "conocerme = to know myself" },
  { es: "Me interesa la electrónica", en: "I'm interested in electronics", cat: "Vocabulary",
    note: "la electrónica = electronics" },
  { es: "La informática es mi pasión", en: "Computer science is my passion", cat: "Vocabulary",
    note: "la informática = computer science" },
  { es: "Trabajo en una fundación", en: "I work at a nonprofit", cat: "Vocabulary",
    note: "una fundación = a foundation (implies nonprofit)" },

  // Saludos y básicos (Lección 1)
  { es: "hasta luego", en: "see you later", cat: "Greetings & basics" },
  { es: "Te llamo luego", en: "I'll call you later", cat: "Greetings & basics",
    note: "luego = later" },
  { es: "hasta pronto", en: "see you soon", cat: "Greetings & basics" },
  { es: "Vuelvo pronto", en: "I'll be back soon", cat: "Greetings & basics",
    note: "pronto = soon" },
  { es: "no pasa nada", en: "don't worry / no big deal", cat: "Greetings & basics" },
  { es: "Que tengas un buen día", en: "Have a good day", cat: "Greetings & basics",
    note: "reply: tú también — you too" },
  { es: "tú también", en: "you too", cat: "Greetings & basics" },
  { es: "¿Cómo te llamas?", en: "What's your name?", cat: "Greetings & basics",
    note: "reflexive: me llamo, te llamas, se llama... — llamarse = to be called" },
  { es: "Me llamo Spencer", en: "My name is Spencer", cat: "Greetings & basics",
    note: "(yo) me llamo = my name is / I am called" },
  { es: "Tú te llamas Delia, ¿no?", en: "Your name is Delia, right?", cat: "Greetings & basics",
    note: "(tú) te llamas = you are called" },
  { es: "¿Cómo se llama tu madre?", en: "What's your mother's name?", cat: "Greetings & basics",
    note: "(él/ella) se llama = he/she is called" },
  { es: "Nos llamamos igual", en: "We have the same name", cat: "Greetings & basics",
    note: "(nosotros) nos llamamos = we are called" },
  { es: "¿Cómo os llamáis?", en: "What are your names? (Spain)", cat: "Greetings & basics",
    note: "(vosotros) os llamáis = you all are called (Spain)" },
  { es: "Sus perros se llaman Luna y Sol", en: "Their dogs are called Luna and Sol", cat: "Greetings & basics",
    note: "(ellos) se llaman = they are called" },
  { es: "Te llamo mañana", en: "I'll call you tomorrow", cat: "Greetings & basics",
    note: "llamar = to call" },
  { es: "Tengo una llamada de trabajo", en: "I have a work call", cat: "Greetings & basics",
    note: "una llamada = a (phone) call" },

  // Pronunciación
  { es: "Pero el perro es bueno", en: "But the dog is good", cat: "Pronunciation",
    note: "single r vs rolled rr — different words! — pero / el perro = but / the dog" },

function fnv1a(s) {
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(s)) {
    h ^= b;
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, "0");
}

function speak(text, lang) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const tag = lang === "es" ? "es-ES" : "en-GB";
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith(lang));
  const v = vs.find(x => x.lang === tag) || vs[0];
  if (v) u.voice = v;
  u.lang = tag;
  u.rate = 0.9 * rates[lang];
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices(); // warm up async voice list

function playClip(card, lang, rateOverride) {
  if (player) player.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  const a = new Audio("audio/" + lang + "/" + fnv1a(card.es) + ".mp3");
  a.playbackRate = rateOverride || rates[lang];
  a.chLang = lang;
  if ("preservesPitch" in a) a.preservesPitch = true;
  const fallback = () => speak(lang === "es" ? card.es : card.en, lang);
  a.onerror = fallback; // clip missing (e.g. card added but audio not regenerated)
  player = a;
  a.play().catch(err => {
    // NotAllowedError = autoplay blocked before the session's first tap.
    // Never leave a 🎧 card blank AND silent: reveal the prompt text (it's
    // never the answer). Anything else = file didn't load: browser TTS.
    if (err && err.name === "NotAllowedError") {
      if (!flipped && mode === "study" && !peeked) { peeked = true; render(); }
    } else if (err && err.name !== "AbortError") {
      fallback();
    }
  });
}

// ---- Pronunciation scoring (on-device, no accounts) ----
// A phoneme-recognition model (wav2vec2 espeak) runs in the browser via
// transformers.js. Reference phones per card live in phonemes.json (from
// tools/gen_phonemes.py, same espeak inventory). Your recording is decoded to
// the phones you actually produced and aligned against the reference — all
// local, the audio never leaves the device. First use downloads the model
// once (~170MB on phones / ~330MB on desktop), then it's cached.
const SCORER_REPO = "onnx-community/wav2vec2-lv-60-espeak-cv-ft-ONNX";
const TRANSFORMERS_CDN = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";
let PHONEMES = null;
let scorerPromise = null;
let micState = "idle";        // idle | rec | busy
let micProgress = 0;
let mediaRec = null, micChunks = [], micTimer = null;
// Hands-free mode: unlocked after the first successful score (mic permission
// and model are known-good by then), then EN→ES cards listen automatically.
let autoMic = localStorage.getItem("chuleta-automic") === "1";

  fetch("phonemes.json").then(r => r.json())
    .then(j => { PHONEMES = j; render(); })
    .catch(() => {});

// Spanish allophones (b/β/v, d/ð, g/ɣ — native speech alternates these) and
// model hair-splitting vowels count as matches. ɾ vs r and θ vs s stay
// distinct: those contrasts are learning targets.
const PH_EQUIV = [["b","β","v"],["d","ð"],["g","ɡ","ɣ"],["e","ɛ"],["o","ɔ"],
                  ["a","ɐ","ä"],["ʝ","j","ʎ"],["s","z"],["i","ɪ"],["u","ʊ"]];
const phClass = {};
PH_EQUIV.forEach((g, k) => g.forEach(p => phClass[p] = k));
function phSame(a, b) {
  return a === b || (phClass[a] !== undefined && phClass[a] === phClass[b]);
}

// Needleman-Wunsch alignment; returns matched flag per reference position.
function alignPhones(ref, hyp) {
  const R = ref.length, H = hyp.length;
  const D = Array.from({ length: R + 1 }, () => new Array(H + 1).fill(0));
  for (let i = 0; i <= R; i++) D[i][0] = i;
  for (let j = 0; j <= H; j++) D[0][j] = j;
  for (let i = 1; i <= R; i++)
    for (let j = 1; j <= H; j++)
      D[i][j] = Math.min(
        D[i - 1][j - 1] + (phSame(ref[i - 1], hyp[j - 1]) ? 0 : 1),
        D[i - 1][j] + 1, D[i][j - 1] + 1);
  const matched = new Array(R).fill(false);
  let i = R, j = H;
  while (i > 0 && j > 0) {
    if (D[i][j] === D[i - 1][j - 1] + (phSame(ref[i - 1], hyp[j - 1]) ? 0 : 1)) {
      if (phSame(ref[i - 1], hyp[j - 1])) matched[i - 1] = true;
      i--; j--;
    } else if (D[i][j] === D[i - 1][j] + 1) i--;
    else j--;
  }
  return matched;
}

function scoreWords(refWords, hyp) {
  const flat = refWords.flat();
  const matched = alignPhones(flat, hyp);
  let pos = 0, hits = 0;
  const words = refWords.map(ph => {
    const ok = matched.slice(pos, pos + ph.length);
    let score = ph.length ? ok.filter(Boolean).length / ph.length : 1;
    // Short function words get swallowed in natural linked speech ("cuándo‿es")
    // — never fail them outright if anything matched.
    if (ph.length <= 2 && ok.some(Boolean)) score = Math.max(score, 0.8);
    hits += ok.filter(Boolean).length;
    pos += ph.length;
    return { ph, ok, score };
  });
  return { words, overall: flat.length ? hits / flat.length : 0 };
}

function canScore(card) {
  return mode === "study" && activeDir === "en-es" && !!card &&

function loadScorer() {
  if (!scorerPromise) scorerPromise = (async () => {
    const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent || "");
    const T = await import(TRANSFORMERS_CDN);
    const model = await T.AutoModel.from_pretrained(SCORER_REPO, {
      dtype: mobile ? "q4" : "q8",
      progress_callback: p => {
        if (p.status === "progress" && p.file && p.file.endsWith(".onnx")) {
          micProgress = Math.round(p.progress || 0);
          renderMic();
        }
      },
    });
    const vocab = await (await fetch(
      "https://huggingface.co/" + SCORER_REPO + "/resolve/main/vocab.json")).json();
    const id2tok = Object.fromEntries(Object.entries(vocab).map(([t, i]) => [i, t]));
    return { T, model, id2tok, pad: vocab["<pad>"] ?? 0 };
  })().catch(err => { scorerPromise = null; throw err; });
  return scorerPromise;
}

async function blobToPCM16k(blob) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const decoded = await ac.decodeAudioData(buf);
  ac.close();
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * 16000), 16000);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  const f = Float32Array.from(rendered.getChannelData(0));
  let mean = 0;
  for (const x of f) mean += x;
  mean /= f.length;
  let v = 0;
  for (const x of f) v += (f.length ? (x - mean) ** 2 : 0);
  const std = Math.sqrt(v / f.length) + 1e-7;
  for (let k = 0; k < f.length; k++) f[k] = (f[k] - mean) / std;
  return f;
}

function ctcPhones(logits, id2tok, pad) {
  const [T_, V] = logits.dims.slice(1);
  const d = logits.data;
  const out = [];
  let prev = -1;
  for (let t = 0; t < T_; t++) {
    let best = 0, bi = -Infinity;
    for (let v = 0; v < V; v++) {
      const x = d[t * V + v];
      if (x > bi) { bi = x; best = v; }
    }
    if (best !== prev && best !== pad) {
      const tok = id2tok[best];
      if (tok && tok !== "|") out.push(tok);
    }
    prev = best;
  }
  return out;
}

// One persistent stream: re-acquiring the mic per rep costs 200–500ms and
// flickers the OS indicator. Released when the tab is hidden.
let micStream = null;
async function getMicStream() {
  if (micStream && micStream.getTracks().some(t => t.readyState === "live")) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return micStream;
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
});

// Safari won't grant the mic (or start audio) outside a user gesture. When
// hands-free mode is on from a previous session, grab both on the first tap
// or keypress so the auto flow has a warm stream to reuse.
const warmUp = () => {
  if (autoMic) getMicStream().catch(() => {});
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    beepCtx ||= new AC();
    beepCtx.resume();
  } catch {}
};
document.addEventListener("pointerdown", warmUp, { once: true });
document.addEventListener("keydown", warmUp, { once: true });

// Short "start speaking now" cue. Recording starts just after it so the tone
// never lands in the scored audio.
let beepCtx = null;
function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    beepCtx ||= new AC();
    if (beepCtx.state === "suspended") beepCtx.resume();
    const o = beepCtx.createOscillator(), g = beepCtx.createGain();
    o.frequency.value = 1000;
    g.gain.setValueAtTime(0.001, beepCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, beepCtx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, beepCtx.currentTime + 0.07);
    o.connect(g);
    g.connect(beepCtx.destination);
    o.start();
    o.stop(beepCtx.currentTime + 0.08);
  } catch {}
}

async function startMic(card, auto) {
  if (micState !== "idle") return;
  micState = "busy"; // arming — blocks a concurrent start during the beep gap
  try {
    const stream = await getMicStream();
    micChunks = [];
    vadNoSpeech = false;
    micAuto = auto;
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => micChunks.push(e.data);
    mediaRec.onstop = () => {
      stopVad();
      if (vadNoSpeech) { vadNoSpeech = false; micState = "idle"; renderMic(); }
      else scoreRecording(card);
    };
    beep();
    await new Promise(r => setTimeout(r, 90));
    mediaRec.start();
    micState = "rec";
    clearTimeout(micTimer);
    micTimer = setTimeout(() => { if (micState === "rec") mediaRec.stop(); }, 12000);
    if (auto) startVad(stream);
    renderMic();
  } catch (e) {
    micState = "idle";
    renderMic();
    $("micStatus").textContent =
      "mic didn't start (" + ((e && e.name) || "error") + ") — tap 🎤 to retry";
  }
}

// Silence detection for hands-free mode: finish ~1.1s after you stop talking;
// give up quietly if nothing was said for 6s.
function startVad(stream) {
  const AC = window.AudioContext || window.webkitAudioContext;
  vadCtx = new AC();
  const an = vadCtx.createAnalyser();
  an.fftSize = 2048;
  vadCtx.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  let spoke = false, lastVoice = 0;
  const t0 = Date.now();
  vadTimer = setInterval(() => {
    if (micState !== "rec") return;
    an.getFloatTimeDomainData(buf);
    let rms = 0;
    for (const x of buf) rms += x * x;
    rms = Math.sqrt(rms / buf.length);
    const now = Date.now();
    if (rms > 0.012) { spoke = true; lastVoice = now; }
    if (spoke && now - lastVoice > 1600) mediaRec.stop();
    else if (!spoke && now - t0 > 6000) { vadNoSpeech = true; mediaRec.stop(); }
  }, 100);
}

function stopVad() {
  clearInterval(vadTimer);
  vadTimer = null;
  if (vadCtx) { vadCtx.close(); vadCtx = null; }
}

// ---- Repeat ladder: after every reveal, repeat after Bon — slow until the
// pronunciation passes, then faster, until clean at full speed. Pass bar is
// 85%, which is what native clips score against this model.
const LADDER_RATES = [0.7, 0.85, 1];
const LADDER_PASS = 0.85;
const LADDER_TRIES = 3;   // misses allowed per speed before moving on anyway
let ladder = null;        // { hash, step, attempts, done }

function repeatEligible(card) {
  return !!card && mode === "study" &&
    !!(PHONEMES && PHONEMES[fnv1a(card.es)]) &&
    typeof navigator !== "undefined" && !!navigator.mediaDevices;
}
// Hands-free flows (auto-ladder, grade lock) engage only after the first
// successful score on THIS device proves mic + model work here.
function canRepeat(card) { return autoMic && repeatEligible(card); }

// The ladder runs only on EN→ES cards after the reveal — the direction where
// the Spanish is the answer being produced. ES→EN is listening comprehension:
// no mic, no ladder, grade on understanding.
function ladderCtx(card) {
  return !!(card && ladder && ladder.hash === fnv1a(card.es) &&
    mode === "study" && activeDir === "en-es" && flipped);
}

function startLadder(card) {
  if (!canRepeat(card)) return;
  const hash = fnv1a(card.es);
  if (ladder && ladder.hash === hash) return;
  // Probe first at full speed: a clean first repeat means no forced drilling.
  ladder = { hash, step: LADDER_RATES.length - 1, attempts: 0, fullTries: 0,
             probe: true, cleared: false, mastered: false, done: false };
  ladderPlayAndListen();
}

function ladderPlayAndListen() {
  const card = currentCard();
  if (!ladderCtx(card) || ladder.done) return;
  playClip(card, "es", LADDER_RATES[ladder.step]);
  player.addEventListener("ended", () => {
    if (ladderCtx(currentCard()) && !ladder.done && micState === "idle" && currentCard() === card)
      startMic(card, true);
  }, { once: true });
  renderMic();
}

// First repeat is a full-speed probe: clean (every word orange+) means done —
// repeats are only forced when pronunciation is actually bad. A bad probe
// drops to 0.7x and climbs back up. One clean repeat at any speed unlocks
// grading; six full-speed tries end the ladder so a bad mic can't trap you.
function ladderAdvance(score) {
  if (!ladder || ladder.done) return;
  const okScore = score && !score.error;
  const wasCleared = ladder.cleared;
  const clean = okScore && score.words.every(w => w.score >= 0.55);
  if (clean) ladder.cleared = true;
  if (ladder.probe) {
    ladder.probe = false;
    if (clean) {
      ladder.mastered = score.overall >= LADDER_PASS;
      ladder.done = true;
      render();
      scheduleAutoGrade();
      return;
    }
    ladder.step = 0; // bad first go — drill from slow
    ladderPlayAndListen();
    return;
  }
  const atFull = ladder.step === LADDER_RATES.length - 1;
  if (atFull) {
    ladder.fullTries += 1;
    if (okScore && score.overall >= LADDER_PASS && ladder.cleared) {
      ladder.mastered = true;
      ladder.done = true;
      render();
      scheduleAutoGrade();
      return;
    }
    if (ladder.fullTries >= 6) {
      ladder.done = true;
      render();
      scheduleAutoGrade();
      return;
    }
  } else if (okScore && score.overall >= LADDER_PASS) {
    ladder.step += 1;
    ladder.attempts = 0;
  } else {
    ladder.attempts += 1;
    if (ladder.attempts >= LADDER_TRIES) { ladder.step += 1; ladder.attempts = 0; }
  }
  if (!wasCleared && ladder.cleared) render(); // unlock the grade buttons now
  ladderPlayAndListen();
}

// Auto-grading: the front attempt (Spanish said from memory, before any
// flip) already tells us whether they knew the card. Strong attempt →
// Correct presses itself once the ladder ends; clearly failed → Wrong.
// The mid-zone (partial recall) stays manual.
let frontScore = null;   // { hash, overall } from the say-from-memory attempt

function scheduleAutoGrade() {
  const card = currentCard();
  if (!card || !flipped || mode !== "study" || activeDir !== "en-es") return;
  if (!frontScore || frontScore.hash !== fnv1a(card.es) || gradeLocked()) return;
  const o = frontScore.overall;
  if (o < 0.45 || o >= 0.7) {
    setTimeout(() => {
      if (currentCard() === card && flipped && !gradeLocked()) grade(o >= 0.7);
    }, 900);
  }
}

// Grading is locked until one good repeat (or the ladder gives up).
// EN→ES only — ES→EN is graded on comprehension, never on speech.
function gradeLocked() {
  const card = currentCard();
  if (!card || mode !== "study" || !flipped || activeDir !== "en-es" || !canRepeat(card)) return false;
  return !(ladder && ladder.hash === fnv1a(card.es) && (ladder.cleared || ladder.done));
}

function resetSpeech() {
  ladder = null;
  frontScore = null;
  cancelMic();
}

function maybeAutoListen(card) {
  if (!autoMic || micState !== "idle" || !card) return;
  if (mode !== "study" || flipped || activeDir !== "en-es") return;
  if (!canScore(card)) return;
  const key = card.id + ":" + activeDir;
  if (key === lastListenKey) return;
  lastListenKey = key;
  const go = () => {
    if (micState === "idle" && currentCard() === card && !flipped) startMic(card, true);
  };
  // Don't record Brooke — wait for the prompt clip to finish.
  if (player && !player.paused && !player.ended) player.addEventListener("ended", go, { once: true });
  else go();
}

async function scoreRecording(card) {
  const startHash = fnv1a(card.es);
  const ladderRep = ladder && !ladder.done && ladder.hash === startHash &&
    activeDir === "en-es" && flipped;
  micState = "busy";
  renderMic();
  try {
    const ref = PHONEMES[fnv1a(card.es)];
    const s = await loadScorer();
    const f = await blobToPCM16k(new Blob(micChunks));
    const out = await s.model({ input_values: new s.T.Tensor("float32", f, [1, f.length]) });
    const hyp = ctcPhones(out.logits, s.id2tok, s.pad);
    const result = scoreWords(ref.p, hyp);
    result.words.forEach((x, i) => x.w = ref.w[i]);
    lastScore = { hash: fnv1a(card.es), words: result.words, overall: result.overall };
    if (!ladderRep && !flipped) frontScore = { hash: lastScore.hash, overall: result.overall };
    if (!autoMic) { autoMic = true; localStorage.setItem("chuleta-automic", "1"); }
  } catch (e) {
    lastScore = { hash: fnv1a(card.es), error: true };
  }
  micState = "idle";
  const cur = currentCard();
  if (!cur || fnv1a(cur.es) !== startHash || mode !== "study") { renderMic(); return; }
  if (!flipped) flip(); else render();
  if (ladderRep) ladderAdvance(lastScore);
}

// Study session
let queue = [];               // card ids: due reviews first, then new cards
let sessionTotal = 0;
let sessionDone = 0;

// Browse session
let browseOrder = [];
let browseIdx = 0;

function filteredDeck() {
  return DECK.filter(c => category === "All" || c.cat === category);
}

// Overtime queue: weakest memories first (soonest due), 20 at a time,
// rebuildable forever.
function startOvertime() {
  const seen = filteredDeck().filter(c => srs[c.id])
    .sort((a, b) => stateOf(a.id).due - stateOf(b.id).due);
  if (!seen.length) return;
  queue = seen.slice(0, 20).map(c => c.id);
  overtime = true;
  sessionTotal = queue.length;
  sessionDone = 0;
  flipped = false;
  peeked = false;
  resetSpeech();
  rollDir();
  render();
}

function buildQueue() {
  rolloverNewLog();
  relearn = {};
  overtime = false;
  const now = Date.now();
  const cards = filteredDeck();
  // Due = any card with saved state whose time has come. That includes lapsed
  // cards (reps 0 but seen before) — relearning doesn't consume new-card slots.
  const due = cards.filter(c => srs[c.id] && srs[c.id].due <= now)
                   .sort((a, b) => stateOf(a.id).due - stateOf(b.id).due);
  const slots = Math.max(0, NEW_PER_DAY - newLog.count);
  const fresh = cards.filter(c => !srs[c.id]).slice(0, slots);
  queue = [...due, ...fresh].map(c => c.id);
  sessionTotal = queue.length;
  sessionDone = 0;
}

function buildBrowse() {
  browseOrder = filteredDeck().map(c => c.id);
  browseIdx = 0;
}

function cardById(id) { return DECK.find(c => c.id === id); }

function currentCard() {
  if (mode === "study") return queue.length ? cardById(queue[0]) : null;
  if (!browseOrder.length) return null;
  browseIdx = ((browseIdx % browseOrder.length) + browseOrder.length) % browseOrder.length;
  return cardById(browseOrder[browseIdx]);
}

function humanDelay(ms) {
  if (ms <= 0) return "now";
  const h = Math.round(ms / 3600000);
  if (h < 20) return "in " + Math.max(1, h) + (h === 1 ? " hour" : " hours");
  const d = Math.round(ms / DAY);
  return d === 1 ? "tomorrow" : "in " + d + " days";
}

function nextDueInfo() {
  const upcoming = filteredDeck()
    .map(c => stateOf(c.id))
    .filter(s => s.reps > 0 && s.due > Date.now());
  if (!upcoming.length) return "";
  const soonest = Math.min(...upcoming.map(s => s.due));
  return "Next review: " + humanDelay(soonest - Date.now());
}

// ---- SM-2 grading, binary buttons ----
// Correct: interval 1d → 6d → interval × ease (classic SM-2 steps); ease
// recovers +0.05 per success (cap 2.5) so a rough start isn't a life sentence.
// Wrong: lapse — ease drops 0.2 (floor 1.3), the card comes back within ~3
// cards and must be answered correctly TWICE this session before it's
// rescheduled (one lucky retry is not relearned). After a lapse the second
// interval is 3 days, not 6 — struggled cards deserve a tighter leash.
let relearn = {};   // id -> corrects still needed this session (not persisted)
// Overtime: practice past the scheduled queue. Correct answers leave the
// schedule untouched (early success must not inflate intervals); a miss is
// real evidence and gets the full lapse treatment.
let overtime = false;

function grade(correct) {
  if (mode !== "study" || !queue.length || !flipped) return;
  if (gradeLocked()) return;
  const id = queue.shift();
  const isNew = !srs[id];
  const s = stateOf(id);
  if (correct) {
    if (relearn[id] > 1) {
      relearn[id] -= 1;
      queue.splice(Math.min(8, queue.length), 0, id);
    } else {
      const wasRelearning = relearn[id] !== undefined;
      delete relearn[id];
      if (!overtime || wasRelearning) {
        if (s.reps === 0) s.interval = 1;
        else if (s.reps === 1) s.interval = s.lapses > 0 ? 3 : 6;
        else s.interval = Math.round(s.interval * s.ease);
        s.ease = Math.min(2.5, Math.round((s.ease + 0.05) * 100) / 100);
        s.reps += 1;
        s.due = Date.now() + s.interval * DAY;
      }
      sessionDone += 1;
    }
  } else {
    s.ease = Math.max(1.3, Math.round((s.ease - 0.2) * 100) / 100);
    s.reps = 0;
    s.interval = 0;
    s.lapses += 1;
    relearn[id] = 2;
    queue.splice(Math.min(3, queue.length), 0, id);
  }
  srs[id] = s;
  saveSrs();
  if (isNew) { rolloverNewLog(); newLog.count += 1; saveNewLog(); }
  flipped = false;
  peeked = false;
  lastScore = null;
  resetSpeech();
  rollDir();
  render();
}

function renderStats() {
  const cards = filteredDeck();
  const now = Date.now();
  let fresh = 0, due = 0, learned = 0;
  cards.forEach(c => {
    const s = stateOf(c.id);
    if (!srs[c.id]) fresh++;
    else if (s.due <= now) due++;
    if (s.interval >= 21) learned++;
  });
  $("stats").innerHTML =
    "new <b>" + fresh + "</b> · due today <b>" + due + "</b> · " +
    "<span class='learned'>learned <b>" + learned + "</b></span>";
}

function render() {
  renderStats();
  $("direction").textContent =
    dir === "mix" ? "Mixed 🎲" : dir === "es-en" ? "ES → EN" : "EN → ES";
  $("direction").title = dir === "mix"
    ? "75% EN→ES, 25% ES→EN — click to fix the direction"
    : "Click to change direction";
  $("sound").textContent = autoSay ? "🔊 auto" : "🔇 manual";
  $("textmode").textContent = scaffold === "texto" ? "📖 text" : scaffold === "audio" ? "🎧 audio" : "🎓 auto";
  $("rateEs").textContent = "ES " + rates.es + "×";
  $("rateEn").textContent = "EN " + rates.en + "×";
  $("shuffle").hidden = mode === "study";
  $("modeStudy").classList.toggle("active", mode === "study");
  $("modeBrowse").classList.toggle("active", mode === "browse");
  $("nav").classList.toggle("hidden", mode === "study");

  const card = currentCard();
  const cardEl = $("card");

  if (mode === "study") {
    $("bar").style.width = sessionTotal ? (sessionDone / sessionTotal * 100) + "%" : "0%";
    $("judge").classList.toggle("hidden", !card);
    const locked = gradeLocked();
    $("correct").disabled = locked;
    $("wrong").disabled = locked;
    $("correct").hidden = !flipped;
    $("wrong").hidden = !flipped;
  } else {
    $("bar").style.width = "0%";
    $("judge").classList.add("hidden");
    $("pos").textContent = browseOrder.length ? (browseIdx + 1) + " / " + browseOrder.length : "0 / 0";
  }

  if (!card) {
    $("frontText").textContent = mode === "study" ? "🎉 Scheduled reviews done" : "No cards here";
    $("frontCat").textContent = "";
    $("frontHint").textContent = mode === "study"
      ? [nextDueInfo(), "extra practice never stretches your intervals"].filter(Boolean).join(" · ")
      : "";
    const anySeen = filteredDeck().some(c => srs[c.id]);
    const anyUnseen = filteredDeck().some(c => !srs[c.id]);
    $("overtime").hidden = mode !== "study" || (!anySeen && !anyUnseen);
    $("morePractice").hidden = !anySeen;
    $("moreNew").hidden = !anyUnseen;
    $("backText").textContent = "";
    $("backScore").textContent = "";
    $("backNote").textContent = "";
    $("backGloss").innerHTML = "";
    $("backHint").textContent = "";
    $("sayFront").hidden = true;
    $("sayBack").hidden = true;
    $("peek").hidden = true;
    $("microw").classList.add("hidden");
    cardEl.classList.remove("flipped");
    return;
  }

  $("overtime").hidden = true;
  const s = stateOf(card.id);
  const earOnly = audioOnlyNow(card);
  const sc = lastScore && lastScore.hash === fnv1a(card.es) ? lastScore : null;
  const scoredSpans = s2 => s2.words.map((x, i) =>
    '<span class="' + (x.score >= 0.8 ? "w-good" : x.score >= 0.55 ? "w-mid" : "w-bad") +
    '" data-wi="' + i + '">' + x.w + "</span>").join(" ");
  if (earOnly) $("frontText").textContent = "🎧";
  else $("frontText").textContent = firstVariant(card, promptLang()).text;
  $("peek").hidden = !earOnly;
  if (sc && !sc.error && activeDir === "en-es") {
    $("backText").innerHTML = scoredSpans(sc);
    $("backScore").textContent =
      (ladder && ladder.hash === sc.hash && ladder.mastered ? "🏆 clean at full speed · "
        : ladder && ladder.hash === sc.hash && ladder.done ? "↷ moving on, it'll come back · "
        : ladder && ladder.hash === sc.hash && ladder.cleared ? "✓ good — grade when ready · " : "") +
      "pronunciation " + Math.round(sc.overall * 100) + "% · tap a word for detail";
  } else {
    $("backText").textContent = firstVariant(card, answerLang()).text;
    $("backScore").textContent = sc && sc.error
      ? "couldn't score that — try again, closer to the mic" : "";
  }
  const altBits = [firstVariant(card, "es").alt, firstVariant(card, "en").alt].filter(Boolean);
  $("backNote").textContent = [card.note, altBits.length ? "also: " + altBits.join(" · ") : ""]
    .filter(Boolean).join(" — ");
  $("backGloss").innerHTML = (GLOSS[card.es] || "").split(" · ").filter(Boolean)
    .map(pair => {
      const [chunk, meaning] = pair.split(" = ");
      return "<b>" + chunk + "</b>&thinsp;–&thinsp;" + (meaning || "");
    }).join(" &nbsp;·&nbsp; ");
  $("frontCat").textContent = card.cat +
    (mode === "study" && s.reps === 0 ? " · new" : "") +
    (overtime ? " · extra" : "");
  $("backLabel").textContent = activeDir === "es-en" ? "English" : "Español";
  $("frontHint").textContent = mode !== "study" ? "tap to flip"
    : earOnly ? "listen — say the translation out loud"
    : (TOUCH && activeDir === "en-es") ? "hold to speak · tap to flip"
    : "say it out loud, then flip";
  $("backHint").textContent = mode !== "study" ? ""
    : gradeLocked() ? "🔒 one clean repeat unlocks grading — every word orange or better"
    : relearn[card.id] > 1 ? "relearning — correct " + relearn[card.id] + " more times this session"
    : "repeat it out loud · if you got it: " + humanDelay((s.reps === 0 ? 1 : s.reps === 1 ? (s.lapses > 0 ? 3 : 6) : Math.round(s.interval * s.ease)) * DAY);
      // projected with pre-recovery ease; off by at most a day on long intervals
  $("sayFront").hidden = false;
  $("sayBack").hidden = false;
  cardEl.classList.toggle("flipped", flipped);
  maybeAutoPlay(card);
  renderMic();
  maybeAutoListen(card);
}

function renderMic() {
  const card = currentCard();
  const enEsBack = activeDir === "en-es" && flipped;
  const ladderOn = ladder && !ladder.done && card && ladder.hash === fnv1a(card.es) && enEsBack;
  const show = mode === "study" && !!card && (ladderOn ||
    (activeDir === "en-es" && !flipped && canScore(card)) ||
    (enEsBack && !autoMic && repeatEligible(card)));
  $("microw").classList.toggle("hidden", !show);
  if (!show) return;
  const b = $("mic");
  b.classList.toggle("rec", micState === "rec");
  b.textContent = micState === "rec" ? "⏹ stop (m)"
    : micState === "busy" ? (micProgress > 0 && micProgress < 100
        ? "↓ model " + micProgress + "%" : "… scoring")
    : ladderOn ? "🔁 repeat (m)"
    : "🎤 say it (m)";
  $("micStatus").textContent =
    micState === "busy" && micProgress > 0 && micProgress < 100 ? "one-time download"
    : micState === "rec" && micAuto ? "listening — pause to finish"
    : ladderOn && ladder.probe ? "repeat after Bon — clean and you're done"
    : ladderOn ? "repeat after Bon · " + LADDER_RATES[ladder.step] + "× · try " +
      (ladder.attempts + 1) + "/" + LADDER_TRIES
    : "";
}

function flip() {
  if (!currentCard()) return;
  flipped = !flipped;
  if (flipped && mode === "study" && activeDir === "en-es") startLadder(currentCard());
  else if (!flipped) resetSpeech();
  render();
}

function move(step) {
  if (mode !== "browse") return;
  flipped = false;
  peeked = false;
  resetSpeech();
  browseIdx += step;
  rollDir();
  render();
}

function setMode(m) {
  mode = m;
  flipped = false;
  peeked = false;
  resetSpeech();
  if (m === "study") buildQueue(); else buildBrowse();
  rollDir();
  render();
}

// Push-to-talk on touch screens: hold the card to record (EN→ES), release
// to score. A short tap still flips. 250ms distinguishes hold from tap.
const TOUCH = matchMedia("(hover: none) and (pointer: coarse)").matches;
let holdTimer = null, holding = false, swallowTap = false;

$("card").addEventListener("click", () => {
  if (swallowTap) { swallowTap = false; return; }
  flip();
});
$("card").addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch" || mode !== "study" || activeDir !== "en-es") return;
  const card = currentCard();
  if (!card || !repeatEligible(card) || micState !== "idle") return;
  holdTimer = setTimeout(() => {
    holding = true;
    swallowTap = true;
    getMicStream().catch(() => {});
    startMic(card, false);
  }, 250);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  $("card").addEventListener(ev, () => {
    clearTimeout(holdTimer);
    if (holding && micState === "rec" && mediaRec) {
      clearTimeout(micTimer);
      mediaRec.stop();
    }
    holding = false;
  }));
$("card").addEventListener("contextmenu", e => { if (TOUCH) e.preventDefault(); });
$("correct").addEventListener("click", () => grade(true));
$("wrong").addEventListener("click", () => grade(false));

// Skip: push the card to the back of today's queue, no grade, always allowed
// (front or back, locked or not) — the escape hatch for any stuck moment.
function skipCard() {
  if (mode !== "study" || !queue.length) return;
  queue.push(queue.shift());
  flipped = false;
  peeked = false;
  resetSpeech();
  rollDir();
  render();
}
$("skip").addEventListener("click", skipCard);

$("morePractice").addEventListener("click", e => {
  e.stopPropagation();   // the empty card face still flips on click
  startOvertime();
});
$("moreNew").addEventListener("click", e => {
  e.stopPropagation();
  // Lend today 10 extra introduction slots (count may go negative; the
  // daily rollover resets it tomorrow).
  rolloverNewLog();
  newLog.count -= 10;
  saveNewLog();
  buildQueue();
  flipped = false; peeked = false; resetSpeech(); rollDir(); render();
});
$("next").addEventListener("click", () => move(1));
$("prev").addEventListener("click", () => move(-1));
$("modeStudy").addEventListener("click", () => setMode("study"));
$("modeBrowse").addEventListener("click", () => setMode("browse"));

$("shuffle").addEventListener("click", () => {
  for (let i = browseOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [browseOrder[i], browseOrder[j]] = [browseOrder[j], browseOrder[i]];
  }
  browseIdx = 0; flipped = false; peeked = false; resetSpeech(); rollDir(); render();
});

$("direction").addEventListener("click", () => {
  dir = dir === "mix" ? "en-es" : dir === "en-es" ? "es-en" : "mix";
  localStorage.setItem("chuleta-dir2", dir);
  flipped = false; peeked = false; resetSpeech(); rollDir(); render();
});

$("sound").addEventListener("click", () => {
  autoSay = !autoSay;
  localStorage.setItem("chuleta-sound", autoSay ? "1" : "0");
  if (!autoSay) {
    if (player) player.pause();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }
  render();
});

$("textmode").addEventListener("click", () => {
  scaffold = scaffold === "auto" ? "audio" : scaffold === "audio" ? "texto" : "auto";
  localStorage.setItem("chuleta-scaffold", scaffold);
  render();
});

["es", "en"].forEach(lang => {
  $(lang === "es" ? "rateEs" : "rateEn").addEventListener("click", () => {
    const steps = RATE_STEPS[lang];
    const i = steps.indexOf(rates[lang]);
    rates[lang] = steps[(i + 1) % steps.length];
    localStorage.setItem("chuleta-rate-" + lang, rates[lang]);
    if (player && player.chLang === lang) player.playbackRate = rates[lang];
    render();
  });
});

$("peek").addEventListener("click", e => {
  e.stopPropagation();
  peeked = true;
  render();
});

$("sayFront").addEventListener("click", e => {
  e.stopPropagation();
  const card = currentCard();
  if (card) playClip(card, promptLang());
});
$("sayBack").addEventListener("click", e => {
  e.stopPropagation();
  const card = currentCard();
  if (card) playClip(card, answerLang());
});

$("mic").addEventListener("click", micToggle);

$("backText").addEventListener("click", e => {
  const wi = e.target && e.target.dataset ? e.target.dataset.wi : undefined;
  if (wi === undefined || !lastScore || !lastScore.words) return;
  e.stopPropagation();
  const x = lastScore.words[+wi];
  $("backScore").textContent = x.w + ":  " +
    x.ph.map((p, k) => (x.ok[k] ? p : "[" + p + "]")).join(" ") +
    "   — [brackets] = not heard";
});

$("reset").addEventListener("click", () => {
  if (!confirm("Delete all review progress?")) return;
  srs = {};
  saveSrs();
  newLog = { date: todayKey(), count: 0 };
  saveNewLog();
  setMode(mode);
});

const cats = ["All", ...new Set(DECK.map(c => c.cat))];
$("category").innerHTML = cats.map(c => `<option>${c}</option>`).join("");
$("category").addEventListener("change", e => {
  category = e.target.value;
  setMode(mode);
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "1") grade(true);
  else if (e.key === "2") grade(false);
  else if (e.key === "ArrowRight") { if (mode === "study") skipCard(); else move(1); }
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "s" && mode === "browse") $("shuffle").click();
  else if (e.key === "s" && mode === "study") skipCard();
  else if (e.key === "e") {
    const c = currentCard();
    if (c) playClip(c, visibleLang());
  }
  else if (e.key === "t") {
    if (currentCard() && audioOnlyNow(currentCard())) { peeked = true; render(); }
  }
  else if (e.key === "m") micToggle();
});

setMode("study");

// Offline support when served over http(s); skipped for file:// so
// double-clicking the file keeps working like before.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
